---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: 3

output: prefixed
interval: 5s

set:
  - pipefail

includes:
  utils:
    taskfile: .task/utils.yaml
    flatten: true
  prettier:
    taskfile: .task/prettier.yaml
    flatten: true
  markdownlint:
    taskfile: .task/markdownlint.yaml
    flatten: true
  check-jsonschema:
    taskfile: .task/check-jsonschema.yaml
    flatten: true
  yamllint:
    taskfile: .task/yamllint.yaml
    flatten: true
  podman:
    taskfile: .task/podman.yaml
    flatten: true
  snyk:
    taskfile: .task/snyk.yaml
    flatten: true
  zizmor:
    taskfile: .task/zizmor.yaml
    flatten: true
  actionlint:
    taskfile: .task/actionlint.yaml
    flatten: true
  hadolint:
    taskfile: .task/hadolint.yaml
    flatten: true
  pre-commit:
    taskfile: .task/pre-commit.yaml
    flatten: true

tasks:
  default:
    desc: Run the development and integration tasks
    summary: |-
      Run the linting, formatting, validation, integration, analysis, and documentation tasks for all container images
      and associated files. Use the following command for additional information on the steps involved:

        $ task --summary develop
    silent: true
    cmds:
      - task: develop

  develop:
    aliases:
      - d
      - dev
    desc: Run the development and integration tasks
    summary: |-
      Run the linting, formatting, validation, integration, analysis, and documentation tasks for all container images
      and associated files.

      The `develop` task is designed to run the core integration steps for this repository (and can do so continuously
      when using the `--watch` option). It is designed to be run during development to ensure that any changes made to
      the code are valid, correctly formatted, and do not introduce any security issues or misconfigurations.

      Specifically, it will format and lint all supported files, validate files, build images, and run
      container security scans, static code analysis tools, and keep the documentation up-to-date,
      where it is automated.
    silent: true
    deps:
      - task: pre-commit:install
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mCompleted\e[0m'{{ end }}"
      - task: lint
      - task: build
      - task: snyk
      - task: analyse

  lint:
    desc: Check linting of Dockerfiles, JSON, YAML, and Markdown files
    summary: |-
      Run linting checks across all Dockerfiles, YAML, and Markdown files to find any
      potential issues or inconsistencies within the code.
    silent: true
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mCompleted\e[0m'{{ end }}"
      - task: prettier
      - task: markdownlint
      - task: yamllint
      - task: hadolint

  build:
    desc: Build the container images locally
    summary: Build the container images locally for the testing and local development.
    silent: true
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mCompleted\e[0m'{{ end }}"
      - task: podman:build

  analyse:
    desc: Run static code analysis and security analysis tools
    summary: >-
      Run static code analysis and security analysis tools against repository configuration files to identify any
      potential security weaknesses. Snyk container scans run separately as part of the image build workflow.
    silent: true
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mCompleted\e[0m'{{ end }}"
      - task: check-jsonschema
      - task: actionlint
      - task: zizmor

  clean:
    desc: Clean temporary directories and files from this function
    summary: |-
      Clean any temporary directories and files created by, or for, this Go application, as well as this Taskfile, and
      the tools and applications called from it.
    run: once
    silent: true
    cmds:
      - defer: "echo -e {{ if .EXIT_CODE }}'\e[1;31mFailed\e[0m'{{ else }}'\e[0;32mCompleted\e[0m'{{ end }}"
      - task: podman:clean
      - task: prettier:clean
      - cmd: rm -rf .task/checksum
      - cmd: rm -rf pipelines/*
